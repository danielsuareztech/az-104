const container = document.getElementById('days');
let allIds = [];

DAYS.forEach(day=>{
  const det = document.createElement('details');
  det.className = 'day';
  det.dataset.day = day.n;

  const tags = day.mods.map(m=>{
    const c = MOD[m];
    return `<span class="modtag" style="background:${c.bg};color:${c.fg}">${c.label}</span>`;
  }).join('');

  const itemsHtml = day.items.map((text,i)=>{
    const id = `d${day.n}i${i}`;
    allIds.push(id);
    return `<label class="item" data-id="${id}">
      <input type="checkbox" data-id="${id}">
      <span>${text}</span>
    </label>`;
  }).join('');

  det.innerHTML = `
    <summary>
      <span class="day-num">DÍA ${String(day.n).padStart(2,'0')}</span>
      <div class="day-title">
        <div class="modtag-row">${tags}</div>
        <div style="font-size:13.5px;font-weight:500;margin-top:2px">${day.title}</div>
        ${day.focus ? `<div class="day-focus">${day.focus}</div>` : ''}
      </div>
      <span class="day-date" data-daydate="${day.n}"></span>
      <span class="day-progress" data-dayprogress="${day.n}">0/${day.items.length}</span>
      <span class="chevron">›</span>
    </summary>
    <div class="items">${itemsHtml}</div>
  `;
  container.appendChild(det);
});

const STORE_KEY = 'progress';
let state = { checked: {}, startDate: null };

async function loadState(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){ /* no previous state, use defaults */ }
  document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    const id = cb.dataset.id;
    if(state.checked[id]){
      cb.checked = true;
      cb.closest('.item').classList.add('done');
    }
  });
  if(state.startDate){
    document.getElementById('startDate').value = state.startDate;
  }
  updateAll();
}

async function saveState(){
  try{
    await window.storage.set(STORE_KEY, JSON.stringify(state), false);
  }catch(e){ console.error('No se pudo guardar el progreso', e); }
}

function updateAll(){
  let totalDone = 0;
  DAYS.forEach(day=>{
    let dayDone = 0;
    day.items.forEach((_,i)=>{
      const id = `d${day.n}i${i}`;
      if(state.checked[id]) dayDone++;
    });
    totalDone += dayDone;
    document.querySelector(`[data-dayprogress="${day.n}"]`).textContent = `${dayDone}/${day.items.length}`;
  });
  document.getElementById('totalLabel').textContent = `${totalDone} / ${allIds.length}`;
  const pct = Math.round((totalDone/allIds.length)*100);
  document.getElementById('totalBar').style.width = pct + '%';
  updateDates();
}

function updateDates(){
  const startVal = document.getElementById('startDate').value;
  const box = document.getElementById('countdownBox');
  document.querySelectorAll('.day').forEach(d=>d.classList.remove('today'));
  if(!startVal){
    box.textContent = 'Elegí una fecha para ver el calendario';
    document.querySelectorAll('[data-daydate]').forEach(el=>el.textContent='');
    return;
  }
  const start = new Date(startVal + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const msPerDay = 86400000;
  let todayDayNum = Math.floor((today - start)/msPerDay) + 1;

  DAYS.forEach(day=>{
    const d = new Date(start.getTime() + (day.n-1)*msPerDay);
    const label = d.toLocaleDateString('es', {day:'2-digit', month:'short'});
    document.querySelector(`[data-daydate="${day.n}"]`).textContent = label;
    if(day.n === todayDayNum){
      document.querySelector(`.day[data-day="${day.n}"]`).classList.add('today');
    }
  });

  const examDate = new Date(start.getTime() + 17*msPerDay);
  const daysLeft = Math.ceil((examDate - today)/msPerDay);
  const examLabel = examDate.toLocaleDateString('es', {day:'2-digit', month:'long', year:'numeric'});
  if(daysLeft > 0){
    box.innerHTML = `Examen estimado: <b>${examLabel}</b> · faltan <b>${daysLeft}</b> días`;
  } else if(daysLeft === 0){
    box.innerHTML = `Hoy es el examen — <b>éxitos</b>`;
  } else {
    box.innerHTML = `Fecha de examen (${examLabel}) ya pasó`;
  }
}

container.addEventListener('change', (e)=>{
  if(e.target.matches('input[type="checkbox"]')){
    const id = e.target.dataset.id;
    state.checked[id] = e.target.checked;
    e.target.closest('.item').classList.toggle('done', e.target.checked);
    updateAll();
    saveState();
  }
});

document.getElementById('startDate').addEventListener('change', (e)=>{
  state.startDate = e.target.value;
  updateDates();
  saveState();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('¿Reiniciar todo el progreso marcado?')){
    state.checked = {};
    document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
      cb.checked = false;
      cb.closest('.item').classList.remove('done');
    });
    updateAll();
    saveState();
  }
});

const firstOpen = DAYS[0];
document.querySelector(`.day[data-day="${firstOpen.n}"]`).open = true;

loadState();
</script>
